server {
    listen 80; # Nginx lắng nghe trên cổng 80 (HTTP mặc đinhh). Khi truy cập http://localhost:8080 (Compose map từ host 8080 --> container 80), request sẽ vào đây 
    index index.php index.html; # chỉ định file mặc định khi truy cập thư mục. Laravel dùng index.php trong thư mục public làm entry point, nên đặt index.php trước
    root /var/www/html/public; # thư mục gốc của web. Với laravel, chỉ thư mục public được expose ra ngoài, còn code khác nằm ngoài không được truy cập trực tiếp 

    # Bảo mật: ẩn version nginx khỏi response headers
    server_tokens off;

    # Upload tối đa 50MB - mặc định nginx chỉ cho 1MB
    client_max_body_size 50M;

    # Timeout cho PHP-FPM xử lý request dài (queue, export, ...)
    fastcgi_read_timeout 300;

    #Gzip compression cho text assets (JS/CSS của Laravel + Vite có thể mất vài MB, gzip giảm ~70% bandwidth)
    gzip on;
    gzip_min_length 1024; # Chỉ nén khi response > 1KB --> giảm overhead nén
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml text/javascript;

    # Security headers 
    add_header X-Frame-Options "SAMEORIGIN"; #Ngăn chặn trang web bị nhúng iframe từ domain khác
    add_header X-Content-Type-Options "nosniff"; # Ngăn chặn browser tự động chuyển đổi content type của file (ví dụ từ text/html sang text/xml) --> giảm nguy cơ XSS từ file upload hoặc nội dung người dùng 
    add_header Referrer-Policy "strict-origin-when-cross-origin"; # Ngăn chặn browser gửi referrer (URL trang trước) khi request từ domain khác --> giảm nguy cơ data leak
    
    # Xử lý static files: trả về file từ thư mục public
    location / { # Xử lý tất cả request gốc
        try_files $uri $uri/ /index.php?$query_string; 
        # $uri: nếu file tồn tại (ví dụ ảnh, css, js) thì trả về file đó 
        # $uri: nếu là thư mục thì trả về index trong thư mục 
        # /index.php?$query_string: nếu không có file/thư mục, chuyển request vào index.php kèm query string --> Laravel router xử lý
    }

    # Cache static assets dài hạn - browser không cần re-download 
    location ~* \.(?:css|js|ico|jpg|jpeg|png|gif|svg|woff2?|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ { # Xử lý các file PHP
        include fastcgi_params; # Nạp cấu hình mặc định cho FastCGI 
        fastcgi_pass app:9000; # Chuyển request PHP tới service app (PHP-FPM container) qua cổng 9000. Đây là cách Nginx giao tiếp với PHP-FPM 
        fastcgi_index index.php; # file mặc định khi request là thư mục 
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # Truyền đường dẫn file PHP thực tế cho PHP-FPM để thực thi 
    }

    location ~ /\.ht { # Chặn truy cập các file .ht* (như .htaccess, .htpasswd)
        deny all;
    }
}