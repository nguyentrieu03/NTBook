[opcache]
; OPcache đã có sẵn trong image php:8.4-fpm nhưng cần bật và cấu hình
; Không có OPcache, PHP parse lại source file mỗi request -> tốn CPU đáng kể

; Bật OPcache
opcache.enable=1

; 128MB RAM dành cho OPcache - đủ cho Laravel
opcache.memory_consumption=128

; 8MB buffer cho string constant (config keys, class names...)
opcache.interned_strings_buffer=8

; Tối đa 10,000 file PHP được cache (Laravel + packages khoảng 5000-8000 files)
opcache.max_accelerated_files=10000

; Không check file thay đổi - production image không bao giờ thay đổi sau khi build
opcache.revalidate_freq=0

; Không check timestamp file PHP - tắt hoàn toàn để đạt hiệu năng tối đa
opcache.validate_timestamps=0

; Giữ lại comment trong file PHP - cần cho Doctrine annotations và một số Laravel packages
opcache.save_comments=1

; Tối ưu hóa quá trình shutdown của PHP-FPM worker
opcache.fast_shutdown=1
