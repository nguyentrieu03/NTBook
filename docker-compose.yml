services: 
  nginx: 
    restart: unless-stopped
    image: nginx:1.25-alpine
    container_name: ntbook_nginx
    ports: 
      - "8080:80"
      - "443:443"
    volumes: 
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks: 
      - ntbook_network 

  app: 
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile 
    container_name: ntbook_app
    environment:
      - DB_HOST=mysql 
      - TMPDIR=/var/www/html/storage/tmp
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -qa php-fpm /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ntbook_network

  mysql: 
    image: mysql:8.0
    container_name: ntbook_mysql
    environment: 
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes: 
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ntbook_network 

  redis:
    image: redis:7-alpine
    container_name: ntbook_redis
    networks:
      - ntbook_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
volumes: 
  mysql_data:

networks:
  ntbook_network:
    driver: bridge 


